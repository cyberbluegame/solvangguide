<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover the Best of Solvang! 🇩🇰</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap');

    :root {
      --paper: #fffdf9;
      --ink: #2c1810;
      --muted: #5a4338;
      --gold: #d4a017;
      --gold-deep: #b88300;
      --gold-soft: #f4e8c9;
      --frame: #d9b86d;
      --flag-red: #c8102e;
      --flag-white: #ffffff;
      --flag-blue: #0033a0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .flyer {
      width: 600px;
      height: 600px;
      background: #fff;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 7px var(--gold-soft);
      padding: 40px 30px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      position: relative;
      page-break-inside: avoid;
    }

    .flag-accent {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 0;
      margin-bottom: 4px;
    }

    .flag-strip {
      width: 80px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg,
        var(--flag-red) 0 40%,
        var(--flag-white) 40% 60%,
        var(--flag-red) 60% 100%);
      box-shadow: 0 0 0 2px rgba(212, 160, 23, 0.15);
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.1rem, 2.15vw, 2.9rem);
      line-height: 1.12;
      letter-spacing: 0.01em;
      font-weight: 700;
      color: var(--ink);
    }

    .subtitle {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--gold-deep);
      text-transform: uppercase;
    }

    .qr-wrap {
      width: 320px;
      height: 320px;
      padding: 12px;
      border: 2px solid rgba(212, 160, 23, 0.7);
      border-radius: 18px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(212, 160, 23, 0.2);
    }

    .qr-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .footer {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.3rem, 1.6vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
      margin-top: 4px;
    }

    @page {
      size: A4 portrait;
      margin: 0.5in;
    }

    @media print {
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
      }

      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .flyer {
        width: 580px;
        height: 580px;
        margin: 0 auto;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="flyer">
    <div class="flag-accent" aria-hidden="true">
      <div class="flag-strip"></div>
    </div>

    <h1>Discover the Best of Solvang! 🇩🇰</h1>
    <p class="subtitle">Scan to Explore</p>

    <div class="qr-wrap" aria-label="QR code to Solvang Guide">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&color=2C1810&bgcolor=FFFFFF&data=https://solvangguide.com"
        alt="QR code linking to Solvang Guide"
      />
    </div>

    <div class="footer">solvangguide.com</div>
  </main>
</body>
</html>
